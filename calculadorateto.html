<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/calculadora.css">   
  <title>Calculadora de kasane teto</title>
</head>
<body>
  <div class="gif-fondo">
    <img src="./imagenes/calculadora-teto/teto bailando.gif">
  </div>

  <div class="calculadora">
    <div class="numbers"><p id="numero"></p></div>
    <div class="btn-numbers">
      <div class="numeros">1</div>
      <div class="numeros">2</div>
      <div class="numeros">3</div>
      <div class="numeros">4</div>
      <div class="numeros">5</div>
      <div class="numeros">6</div>
      <div class="numeros">7</div>
      <div class="numeros">8</div>
      <div class="numeros">9</div>
      <div class="numeros">+</div>
      <div class="numeros">0</div>
      <div class="numeros">x</div>
      <div class="numeros">/</div>
      <div class="numeros">-</div>
      <div class="numeros">=</div>
      <div id="numeroborrar">C</div>
    </div>
  </div>

  <script src="./js/calculadora-teto.js"></script>
</body>
</html>

<script>
  // Source - https://stackoverflow.com/a/36333228
// Posted by ddepablo
// Retrieved 2026-07-28, License - CC BY-SA 3.0

header("Access-Control-Allow-Origin: *");
header("Access-Control-Allow-Methods: PUT, GET, POST");
header("Access-Control-Allow-Headers: Origin, X-Requested-With, Content-Type, Accept");

  const options = {
  method: 'POST',
  headers: {
    model: 's2.1-pro-free',
    Authorization: 'Bearer <token>',
    'Content-Type': 'application/json'
  },
  body: JSON.stringify({
    text: '<string>',
    temperature: 0.7,
    top_p: 0.7,
    references: [{audio: '<string>', text: '<string>'}],
    reference_id: '0118a35dcb604837abe7961a43e13ba8',
    prosody: {speed: 1, volume: 0, normalize_loudness: true},
    chunk_length: 300,
    normalize: true,
    format: 'mp3',
    sample_rate: 123,
    mp3_bitrate: 128,
    opus_bitrate: -1000,
    latency: 'normal',
    max_new_tokens: 1024,
    repetition_penalty: 1.2,
    min_chunk_length: 50,
    condition_on_previous_chunks: true,
    early_stop_threshold: 1,
    features: []
  })
};

fetch('https://api.fish.audio/v1/tts', options)
  .then(res => res.json())
  .then(res => console.log(res))
  .catch(err => console.error(err));
</script>
