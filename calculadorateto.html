<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/calculadora.css">   
  <title>Calculadora de kasane teto</title>
</head>
<body>
  <div class="gif-fondo">
    <img id="gif" src="./imagenes/calculadora-teto/teto bailando.gif">
  </div>

  <div class="calculadora">
    <div class="numbers"><p id="numero"></p></div>
    <div class="btn-numbers">
      <div class="numeros">7</div>
      <div class="numeros">8</div>
      <div class="numeros">9</div>
      <div class="numeros">4</div>
      <div class="numeros">5</div>
      <div class="numeros">6</div>
      <div class="numeros">1</div>
      <div class="numeros">2</div>
      <div class="numeros">3</div>
      <div class="numeros">+</div>
      <div class="numeros">0</div>
      <div class="numeros">x</div>
      <div class="numeros">/</div>
      <div class="numeros">-</div>
      <div class="numeros">.</div>
      <div id="igual" class="numeros">=</div>
      <div  id="numeroborrar">C</div>
      <div class="numeros"></div>
    </div>
  </div>

  <div id="Cambiar-Gif"><img id="tetogirando" src="./imagenes/calculadora-teto/tetogif3.gif"></div>

  <script src="./js/calculadora-teto.js"></script>
</body>
</html>
