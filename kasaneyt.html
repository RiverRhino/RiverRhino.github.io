<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teto y Miku Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            padding: 20px;
        }

        #yt-player {
            /* Mantenemos el reproductor visible por ahora para pruebas */
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .custom-controls {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #39c5bb;
            border: none;
            border-radius: 5px;
            color: #1e1e1e;
            font-weight: bold;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Estilo para la lista interactiva */
        #playlist {
            list-style: none;
            padding: 0;
            max-width: 640px;
        }

        #playlist li {
            cursor: pointer;
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background-color 0.3s;
        }

        #playlist li:hover {
            background-color: #333;
        }

        #playlist li img {
            border-radius: 5px;
            object-fit: cover;
        }

        #playlist li.active {
            color: #39c5bb;
            /* Cyan de Miku */
            border-left: 4px solid #39c5bb;
            background-color: #2a2a2a;
        }
    </style>
</head>

<body>
    <div class="player-wrapper">
        <!-- El div que será reemplazado por el video -->
        <div id="yt-player"></div>

        <!-- Botones de control -->
        <div class="custom-controls">
            <button id="btn-play-pause" disabled>Cargando...</button>
        </div>
    </div>

    <!-- Lista vacía que llenaremos con la API -->
    <ul id="playlist"></ul>

    <!-- NUEVO: Botón para paginación -->
    <button id="btn-load-more"
        style="display: none; width: 100%; max-width: 640px; margin-top: 10px; background-color: #2a2a2a; color: white;">
        Cargar más canciones 👇
    </button>

    <script>
        // --- VARIABLES GLOBALES ---
        const API_KEY = 'AIzaSyBYrNt4TrzbY0ejfafArtIAKFUbiQMGzL0'; // ¡Reemplaza esto con tu clave real!
        let player;
        let isPlaying = false;
        let firstVideoId = '';


        // --- 1. FUNCIÓN PRINCIPAL ---
        // --- MODIFICADO: inicializarApp ---
        async function inicializarApp() {
            try {
                // Pasamos "false" porque es la primera búsqueda, no una paginación
                const videos = await buscarCancionesVocaloid(false);
                renderizarLista(videos, true); // true para que limpie el "Cargando..."

                firstVideoId = videos[0].id.videoId;
                cargarIframeAPI();
            } catch (error) {
                console.error(error);
                document.getElementById('playlist').innerHTML = "<li>Error al cargar las canciones. Revisa la consola.</li>";
            }
        }

        // --- NUEVO: Evento para el botón de cargar más ---
        document.getElementById('btn-load-more').addEventListener('click', async () => {
            const btn = document.getElementById('btn-load-more');
            btn.innerText = 'Cargando...';
            btn.disabled = true;

            try {
                // Pasamos "true" para usar el nextPageToken
                const nuevosVideos = await buscarCancionesVocaloid(true);
                // Pasamos "false" para que ANEXE los nuevos videos al final en lugar de borrar la lista
                renderizarLista(nuevosVideos, false);
            } catch (error) {
                console.error("Error al cargar más:", error);
            }

            btn.innerText = 'Cargar más canciones 👇';
            btn.disabled = false;
        });

        // Añade esta variable al inicio, junto a tus otras variables globales
        let nextPageToken = '';

        // --- MODIFICADO: Acepta un parámetro para saber si es la primera carga o la siguiente ---
        async function buscarCancionesVocaloid(cargarMas = false) {
            const query = encodeURIComponent('Kasane Teto OR Hatsune Miku song');

            // Nota: Puedes subir maxResults hasta 50 si quieres traer más videos de golpe
            let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${query}&type=video&key=${API_KEY}`;

            // Si estamos pidiendo la siguiente página, anexamos el token a la URL
            if (cargarMas && nextPageToken) {
                url += `&pageToken=${nextPageToken}`;
            }

            const respuesta = await fetch(url);
            const data = await respuesta.json();

            if (data.error) {
                throw new Error(data.error.message);
            }

            // Guardamos el token que YouTube nos da para la *próxima* página
            // Si ya no hay más resultados, lo dejamos vacío
            nextPageToken = data.nextPageToken || '';

            // Mostrar u ocultar el botón dependiendo de si hay más páginas
            const btnCargarMas = document.getElementById('btn-load-more');
            if (nextPageToken) {
                btnCargarMas.style.display = 'block';
            } else {
                btnCargarMas.style.display = 'none';
            }

            return data.items;
        }

        // --- MODIFICADO: Añadimos limpiarLista para decidir si borramos o anexamos ---
        function renderizarLista(videos, limpiarLista = true) {
            const playlistUl = document.getElementById('playlist');

            if (limpiarLista) {
                playlistUl.innerHTML = '';
            }

            videos.forEach((video, index) => {
                const videoId = video.id.videoId;
                const titulo = video.snippet.title;
                const miniatura = video.snippet.thumbnails.default.url;

                const li = document.createElement('li');
                li.dataset.id = videoId;

                // Solo marcamos el primero como activo si estamos limpiando la lista (carga inicial)
                if (index === 0 && limpiarLista) li.classList.add('active');

                li.innerHTML = `
            <img src="${miniatura}" alt="Miniatura" width="120">
            <span>${titulo}</span>
        `;

                li.addEventListener('click', () => {
                    if (player && player.loadVideoById) {
                        player.loadVideoById(videoId);

                        document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('active'));
                        li.classList.add('active');

                        const playPauseBtn = document.getElementById('btn-play-pause');
                        playPauseBtn.innerText = "⏸️ Pausa";
                        isPlaying = true;
                    }
                });

                playlistUl.appendChild(li);
            });
        }

        // --- 4. CARGAR IFRAME API ---
        function cargarIframeAPI() {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // --- 5. EVENTOS DEL REPRODUCTOR YOUTUBE ---
        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('yt-player', {
                height: '360',
                width: '640',
                videoId: firstVideoId, // Usa el ID que obtuvimos dinámicamente
                playerVars: {
                    'controls': 0,
                    'disablekb': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            const btn = document.getElementById('btn-play-pause');
            btn.innerText = "▶️ Play";
            btn.disabled = false;

            btn.addEventListener('click', () => {
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            });
        }

        function onPlayerStateChange(event) {
            const btn = document.getElementById('btn-play-pause');
            if (event.data == YT.PlayerState.PLAYING) {
                btn.innerText = "⏸️ Pausa";
                isPlaying = true;
            } else if (event.data == YT.PlayerState.PAUSED) {
                btn.innerText = "▶️ Play";
                isPlaying = false;
            }
        }

        // ¡Iniciar la aplicación!
        inicializarApp();
    </script>
</body>

</html>
